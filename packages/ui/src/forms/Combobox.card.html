<!-- @dsCard group="Components" viewport="700x420" name="Combobox" subtitle="Searchable single-select, fully keyboard-operable" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; background: var(--card); font-family: var(--font-sans); }
  .wrap { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .cap { font-size: var(--text-label); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--muted-foreground); margin: 0 0 6px; }
  .stack { display: flex; flex-direction: column; gap: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Combobox, Kbd, Label, Text } = window.CashflowDesignSystem_2cf89d;
  function Demo() {
    
    return (
      <div className="wrap">
        <div className="stack">
          <Label htmlFor="category">Assign category</Label>
          <Combobox id="category" name="category" aria-describedby="category-hint" defaultValue="groceries" placeholder="Search categories…" options={[
            { value: 'groceries', label: 'Groceries' },
            { value: 'dining', label: 'Dining' },
            { value: 'transport', label: 'Transport' },
            { value: 'subscriptions', label: 'Subscriptions' },
            { value: 'income', label: 'Income' },
            { value: 'fees', label: 'Fees' },
          ]} />
          <Text id="category-hint" variant="body-sm" tone="muted">Type to filter; Arrow keys to move, Enter to choose.</Text>
        </div>
        <div className="stack">
          <p className="cap">Disabled</p>
          <Combobox disabled placeholder="Search categories…" options={[{ value: 'groceries', label: 'Groceries' }]} />
        </div>
        <Text variant="body-sm" tone="muted">
          Keyboard: <Kbd>↓</Kbd> / <Kbd>↑</Kbd> move the active row (wrapping), <Kbd>Home</Kbd> / <Kbd>End</Kbd> jump to the ends,
          {' '}<Kbd>Enter</Kbd> commits it, <Kbd>Esc</Kbd> closes and discards the filter. Arrowing never fires onValueChange —
          selection does not follow focus. id / name / aria-* are routed to the inner search input, so clicking the label focuses the field.
        </Text>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
