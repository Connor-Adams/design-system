<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; background: var(--card); font-family: var(--font-sans); }
  .wrap { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .cap { font-size: var(--text-label); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--muted-foreground); margin: 0 0 6px; }
  .stack { display: flex; flex-direction: column; gap: 4px; }
  .box { max-width: 420px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Label, Slider, Text } = window.CashflowDesignSystem_2cf89d;
  function Demo() {
    return (
      <div className="wrap box">
        <div className="stack">
          <Label htmlFor="threshold">Large-transaction alert</Label>
          <Slider id="threshold" name="threshold" aria-describedby="threshold-hint" min={0} max={500} step={10} defaultValue={120} showValue format={(v) => '$' + v} />
          <Text id="threshold-hint" variant="body-sm" tone="muted">
            id / name / aria-* are routed to the inner range input, so clicking the label focuses the control.
          </Text>
        </div>
        <div className="stack">
          <Text variant="label" tone="muted">Disabled</Text>
          <Slider aria-label="Disabled example" defaultValue={40} disabled />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
