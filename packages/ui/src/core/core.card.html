<!-- @dsCard group="Components" viewport="700x980" name="Core — Button, Badge, Card" subtitle="Oxblood primary, neutral variants, brand pills, configurable card surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; background: var(--card); }
  .grid { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .cap { font-size: var(--text-label); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; color: var(--muted-foreground); margin: 0 0 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, Badge, Card, CardHeader, CardTitle, CardDescription, CardContent } = window.CashflowDesignSystem_2cf89d;
  function Demo() {
    return (
      <div className="grid">
        <div>
          <p className="cap">Buttons</p>
          <div className="row">
            <Button variant="primary">Add transaction</Button>
            <Button variant="secondary">Cancel</Button>
            <Button variant="outline">Filter</Button>
            <Button variant="ghost">Skip</Button>
            <Button variant="destructive">Delete</Button>
            <Button variant="link">Learn more</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
        </div>
        <div className="row" style={{ alignItems: 'flex-end' }}>
          <Button size="sm" variant="primary">Small</Button>
          <Button size="default" variant="primary">Default</Button>
          <Button size="lg" variant="primary">Large</Button>
        </div>
        <div>
          <p className="cap">Badges</p>
          <div className="row">
            <Badge>Active</Badge>
            <Badge variant="secondary">CAD</Badge>
            <Badge variant="success">Reconciled</Badge>
            <Badge variant="outline">Pending</Badge>
            <Badge variant="destructive">Flagged</Badge>
            <Badge variant="count">12</Badge>
          </div>
        </div>
        <div>
          <p className="cap">Card — default (no props)</p>
          <Card style={{ maxWidth: 320 }}>
            <CardHeader>
              <CardTitle>Net worth</CardTitle>
              <CardDescription>Across all accounts · CAD</CardDescription>
            </CardHeader>
            <CardContent style={{ fontSize: '1.55rem', fontWeight: 700, letterSpacing: '-0.01em' }}>$128,400</CardContent>
          </Card>
        </div>

        <div>
          <p className="cap">Card — header actions (title leads, actions trail)</p>
          <Card style={{ maxWidth: 440 }}>
            <CardHeader actions={<Button size="sm" variant="secondary">Export</Button>}>
              <CardTitle>Spending by category</CardTitle>
              <CardDescription>June 2025 · CAD</CardDescription>
            </CardHeader>
            <CardContent>$3,240.00 across 8 categories</CardContent>
          </Card>
        </div>

        <div>
          <p className="cap">Card — variant × padding</p>
          {['default', 'nested', 'plain'].map((variant) => (
            <div key={variant} className="row" style={{ alignItems: 'stretch', marginBottom: 10 }}>
              {['none', 'sm', 'default', 'lg'].map((padding) => (
                <Card key={padding} variant={variant} padding={padding} style={{ minWidth: 138 }}>
                  <CardTitle style={{ fontSize: 'var(--text-body)' }}>{variant}</CardTitle>
                  <CardDescription>padding={padding}</CardDescription>
                </Card>
              ))}
            </div>
          ))}
        </div>

        <div>
          <p className="cap">Card — radius (orthogonal to variant)</p>
          <div className="row">
            {['md', 'lg', 'xl'].map((radius) => (
              <Card key={radius} radius={radius} style={{ minWidth: 138 }}>
                <CardTitle style={{ fontSize: 'var(--text-body)' }}>radius={radius}</CardTitle>
              </Card>
            ))}
          </div>
        </div>

        <div>
          <p className="cap">Card — nested composition (no stacked shadow)</p>
          <Card padding="lg" radius="xl" style={{ maxWidth: 440 }}>
            <CardHeader actions={<Button size="sm" variant="ghost">Edit</Button>}>
              <CardTitle>Accounts</CardTitle>
              <CardDescription>Two connected, one needs attention</CardDescription>
            </CardHeader>
            <CardContent style={{ display: 'grid', gap: 12 }}>
              <Card variant="nested" padding="sm" radius="xl">
                <CardTitle style={{ fontSize: 'var(--text-body)' }}>Chequing · 4021</CardTitle>
                <CardDescription>Synced 6 minutes ago</CardDescription>
              </Card>
              <Card variant="nested" padding="sm" radius="xl">
                <CardTitle style={{ fontSize: 'var(--text-body)' }}>Visa · 8842</CardTitle>
                <CardDescription>Re-authentication required</CardDescription>
              </Card>
            </CardContent>
          </Card>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
